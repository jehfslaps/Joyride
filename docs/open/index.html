<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Joyride</title>
<style>
  :root { --bg: #f3f8f4; --text: #0b1a12; --text2: #4d6656; --brand: #1e8a57; --onBrand: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #070d0a; --text: #e6f7ec; --text2: #8fb39c; --brand: #7cff6b; --onBrand: #0b1a12; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; display: grid; gap: 14px; }
  h1 { font-size: 26px; margin: 0; }
  p { margin: 0; color: var(--text2); }
  a.button { display: block; padding: 16px; border-radius: 999px; background: var(--brand); color: var(--onBrand); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Joyride…</h1>
  <p id="note">If nothing happens, tap the button. You’ll need Joyride (from TestFlight) on this phone.</p>
  <a class="button" id="open" href="#">Open in Joyride</a>
</main>
<script>
  // The drive is in the part after "#", which never leaves this phone.
  const data = location.hash.slice(1);
  const link = 'joyride://import?d=' + encodeURIComponent(data);
  const button = document.getElementById('open');
  if (!/^v1\//.test(data)) {
    document.getElementById('title').textContent = 'This link is incomplete';
    document.getElementById('note').textContent = 'Try scanning the code again, or use Copy link on the Joyride Draw page.';
    button.style.display = 'none';
  } else {
    button.href = link;
    location.href = link;
  }
</script>
</body>
</html>
