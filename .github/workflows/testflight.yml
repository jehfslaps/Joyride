name: TestFlight

# Builds a signed release of the iPhone app and uploads it to App Store
# Connect, where it shows up in TestFlight. Run it from the Actions tab
# ("Run workflow") once the App Store Connect secrets are saved.
#
# Secrets needed (Settings > Secrets and variables > Actions):
#   MAPBOX_DOWNLOADS_TOKEN, MAPBOX_PUBLIC_TOKEN
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    App Store Connect issuer ID
#   ASC_KEY_P8       the contents of the downloaded AuthKey_XXXX.p8 file

on:
  workflow_dispatch:
    inputs:
      carplay:
        description: "Include CarPlay (only after Apple has approved the CarPlay entitlement)"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
      APPLE_TEAM_ID: YCD5K76V6N
      BUILD_NUMBER: ${{ github.run_number }}
      JOYRIDE_CARPLAY: ${{ inputs.carplay && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are saved
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 MAPBOX_DOWNLOADS_TOKEN MAPBOX_PUBLIC_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing."; missing=1; fi
          done
          exit $missing

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Keys
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "EXPO_PUBLIC_MAPBOX_TOKEN=$MAPBOX_PUBLIC_TOKEN" > .env.local
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # The archive is built unsigned: Xcode's automatic signing would want a
      # development profile, which needs a registered iPhone. The export step
      # below signs everything for the App Store with Apple's cloud-managed
      # distribution certificate instead.
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Joyride.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to App Store Connect
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Joyride.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          grep -q -E "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log

      - name: Show build errors
        if: failure()
        working-directory: ios
        run: |
          grep -n -B2 -A6 "error:" archive.log | head -300 || true
          tail -60 archive.log || true
          tail -80 export.log 2>/dev/null || true
          ls ~/Library/Logs 2>/dev/null; find /var/folders -name "IDEDistribution*.log" 2>/dev/null | head -3 | xargs -I{} tail -60 {} || true

      - name: Clean up keys
        if: always()
        run: rm -f ~/.netrc ~/.appstoreconnect/private_keys/*.p8 .env.local
