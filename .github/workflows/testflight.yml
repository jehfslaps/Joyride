name: TestFlight

# Builds a signed release of the iPhone app and uploads it to App Store
# Connect, where it shows up in TestFlight. Run it from the Actions tab
# ("Run workflow") once the App Store Connect secrets are saved.
#
# Secrets needed (Settings > Secrets and variables > Actions):
#   MAPBOX_DOWNLOADS_TOKEN, MAPBOX_PUBLIC_TOKEN
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    App Store Connect issuer ID
#   ASC_KEY_P8       the contents of the downloaded AuthKey_XXXX.p8 file

on:
  workflow_dispatch:
    inputs:
      carplay:
        description: "Include CarPlay (only after Apple has approved the CarPlay entitlement)"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
      APPLE_TEAM_ID: YCD5K76V6N
      BUILD_NUMBER: ${{ github.run_number }}
      JOYRIDE_CARPLAY: ${{ inputs.carplay && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are saved
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 MAPBOX_DOWNLOADS_TOKEN MAPBOX_PUBLIC_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing."; missing=1; fi
          done
          exit $missing

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Keys
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "EXPO_PUBLIC_MAPBOX_TOKEN=$MAPBOX_PUBLIC_TOKEN" > .env.local
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # A short-lived "Apple Distribution" certificate and App Store profile,
      # made through the App Store Connect API and removed again at the end.
      - name: Signing certificate and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          S="$RUNNER_TEMP/signing"
          mkdir -p "$S"
          echo "SIGNING_DIR=$S" >> "$GITHUB_ENV"
          openssl req -new -newkey rsa:2048 -nodes -keyout "$S/dist.key" -out "$S/dist.csr" -subj "/CN=Joyride CI/O=Joyride" 2>/dev/null
          ASC_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            node .github/scripts/asc-signing.mjs setup com.joyridedrives.app7k2 "$S/dist.csr" "$S"

          openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          P12PW=$(openssl rand -hex 16)
          openssl pkcs12 -export -legacy -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout "pass:$P12PW" 2>/dev/null \
            || openssl pkcs12 -export -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout "pass:$P12PW"

          KC="$RUNNER_TEMP/joyride.keychain-db"
          KCPW=$(openssl rand -hex 16)
          echo "SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          curl -fsSL -o "$S/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            && security import "$S/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$S/dist.p12" -k "$KC" -P "$P12PW" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"

          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"
            cp "$S/app.mobileprovision" "$D/$(cat "$S/profile-uuid").mobileprovision"
          done
          echo "PROFILE_NAME=$(cat "$S/profile-name")" >> "$GITHUB_ENV"
          rm -f "$S/dist.key" "$S/dist.p12"

          # What the profile allows, for the log.
          security cms -D -i "$S/app.mobileprovision" > "$S/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$S/profile.plist" || true
          if [ "$JOYRIDE_CARPLAY" = "1" ]; then
            if [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.carplay-maps' "$S/profile.plist" 2>/dev/null)" != "true" ]; then
              echo "::error::The App Store profile doesn't include CarPlay yet. Turn on CarPlay Navigation for the app's identifier at https://developer.apple.com/account/resources/identifiers/list and run this again."
              exit 1
            fi
            echo "CarPlay navigation is in the profile."
          fi

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Sign the app with the App Store profile
        working-directory: ios
        run: |
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open(Dir["*.xcodeproj"].first)
            target = project.targets.find { |t| t.name == "Joyride" } || project.targets.first
            target.build_configurations.each do |c|
              next unless c.name == "Release"
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              puts "#{target.name} Release: manual signing with \"#{ENV["PROFILE_NAME"]}\""
            end
            project.save'

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Joyride.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to App Store Connect
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.joyridedrives.app7k2</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Joyride.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          grep -q -E "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log

      - name: Show build errors
        if: failure()
        working-directory: ios
        run: |
          grep -n -B2 -A6 "error:" archive.log | head -300 || true
          tail -60 archive.log || true
          tail -80 export.log 2>/dev/null || true
          ls ~/Library/Logs 2>/dev/null; find /var/folders -name "IDEDistribution*.log" 2>/dev/null | head -3 | xargs -I{} tail -60 {} || true

      - name: Remove the signing certificate and keys
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$SIGNING_DIR" ] && [ -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ]; then
            ASC_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
              node .github/scripts/asc-signing.mjs cleanup "$SIGNING_DIR" || true
          fi
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -rf "$SIGNING_DIR" ~/.netrc ~/.appstoreconnect/private_keys/*.p8 .env.local
