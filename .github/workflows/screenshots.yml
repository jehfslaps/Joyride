name: Screenshots

# Builds a demo version of the app (sample drives, no welcome screen), runs it
# in the iPhone simulator, and saves screenshots of the main screens to a
# private draft release called "screenshots".

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
      BUNDLE_ID: com.joyridedrives.app7k2
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Keys and demo mode
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          printf 'EXPO_PUBLIC_MAPBOX_TOKEN=%s\nEXPO_PUBLIC_DEMO=1\n' "$MAPBOX_PUBLIC_TOKEN" > .env.local
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Start an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = next((d for d in devs if d["name"] == "iPhone 17 Pro"), None) or next(d for d in devs if d["name"].startswith("iPhone"))
          print(pick["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl location "$DEVICE" set 33.9792,-118.0328

      - name: Install and take screenshots
        run: |
          set -x
          APP=$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -1)
          ls "$APP/Frameworks" | tee shots-frameworks.txt || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location-always "$BUNDLE_ID" || xcrun simctl privacy "$DEVICE" grant location "$BUNDLE_ID"
          mkdir -p shots
          mv shots-frameworks.txt shots/app-frameworks.txt 2>/dev/null || true
          START=$(date "+%Y-%m-%d %H:%M:%S")

          # Each screen: quit the app, tell it which screen to open, start it, wait, capture.
          screen() {
            name="$1"; route="$2"; wait="$3"
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            if [ -n "$route" ]; then
              xcrun simctl spawn "$DEVICE" defaults write "$BUNDLE_ID" demoRoute "$route"
            else
              xcrun simctl spawn "$DEVICE" defaults delete "$BUNDLE_ID" demoRoute 2>/dev/null || true
            fi
            SIMCTL_CHILD_TZ=America/Los_Angeles xcrun simctl launch "$DEVICE" "$BUNDLE_ID" || true
            sleep "$wait"
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }

          for LOOK in dark light; do
            xcrun simctl ui "$DEVICE" appearance "$LOOK"
            sleep 2
            screen "$LOOK-1-home" "" 40
            screen "$LOOK-2-saved-drive" "/drive/1794114300000" 12
            screen "$LOOK-3-fun-routes" "/routes?lng=-117.9243&lat=33.8704&name=Downtown%20Fullerton&pick=weave" 50
            screen "$LOOK-4-surprise-me" "/surprise" 10
            screen "$LOOK-5-settings" "/settings" 8
            screen "$LOOK-6-welcome" "/welcome" 8
          done
          xcrun simctl ui "$DEVICE" appearance dark

          # Motion check: video of the switch being flipped back mid-slide, and of routes arriving.
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" defaults write "$BUNDLE_ID" demoRoute "/surprise?wiggle=1"
          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force shots/motion-surprise.mp4 &
          REC=$!
          sleep 2
          SIMCTL_CHILD_TZ=America/Los_Angeles xcrun simctl launch "$DEVICE" "$BUNDLE_ID" || true
          sleep 12
          kill -INT $REC; wait $REC || true
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" defaults write "$BUNDLE_ID" demoRoute "/routes?lng=-117.9462&lat=33.9319&name=La%20Habra"
          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force shots/motion-routes.mp4 &
          REC=$!
          sleep 2
          SIMCTL_CHILD_TZ=America/Los_Angeles xcrun simctl launch "$DEVICE" "$BUNDLE_ID" || true
          sleep 30
          kill -INT $REC; wait $REC || true

          screen dark-7-relive-navigation "/drive/1794717720000?go=1" 60
          sleep 30
          xcrun simctl io "$DEVICE" screenshot shots/dark-8-relive-navigation-later.png

          # Logs, to see why anything went wrong.
          xcrun simctl spawn "$DEVICE" log show --start "$START" --style compact \
            --predicate 'process == "Joyride" OR eventMessage CONTAINS[c] "joyride"' > shots/app-log.txt 2>&1 || true
          tail -c 400000 shots/app-log.txt > shots/app-log-tail.txt || true
          rm -f shots/app-log.txt
          cp ~/Library/Logs/DiagnosticReports/Joyride* shots/ 2>/dev/null || true
          ls -la shots

      - name: Save screenshots to a draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/* >/dev/null 2>&1 || exit 0
          gh release delete screenshots --yes --cleanup-tag 2>/dev/null || true
          gh release create screenshots shots/* --draft --target "$GITHUB_SHA" \
            --title "App screenshots" --notes "Simulator screenshots of the demo build. Draft: only the owner can see it."

      - name: Show build errors
        if: failure()
        working-directory: ios
        run: grep -n -B2 -A6 "error:" xcodebuild.log | head -200 || true

      - name: Clean up keys
        if: always()
        run: rm -f ~/.netrc .env.local
